<!-- 3D Object -->  
<div class="scene">  
  <div class="card-3d" id="card3d">  
    <div class="glow"></div>  
  
    <div class="card-content">  
      <span>☁️</span>  
      <h2>Cloud & DevOps</h2>  
      <p>Linux • AWS • Git • DevOps</p>  
    </div>  
  </div>  
</div>  
  
<style>  
.scene {  
  width: 350px;  
  height: 350px;  
  perspective: 1000px;  
  display: flex;  
  align-items: center;  
  justify-content: center;  
}  
  
.card-3d {  
  width: 260px;  
  height: 330px;  
  position: relative;  
  border-radius: 25px;  
  transform-style: preserve-3d;  
  transition: transform 0.12s ease-out;  
  background: linear-gradient(145deg, #1d0733, #090014);  
  border: 1px solid #a94cff;  
  box-shadow:  
    0 0 25px rgba(169, 76, 255, 0.5),  
    inset 0 0 30px rgba(169, 76, 255, 0.1);  
  overflow: hidden;  
}  
  
.glow {  
  position: absolute;  
  width: 120px;  
  height: 120px;  
  border-radius: 50%;  
  background: #b94cff;  
  filter: blur(60px);  
  opacity: 0.5;  
  transform: translateZ(20px);  
}  
  
.card-content {  
  position: absolute;  
  inset: 0;  
  display: flex;  
  flex-direction: column;  
  align-items: center;  
  justify-content: center;  
  text-align: center;  
  transform: translateZ(60px);  
}  
  
.card-content span {  
  font-size: 70px;  
  margin-bottom: 20px;  
}  
  
.card-content h2 {  
  color: #fff;  
  margin-bottom: 12px;  
}  
  
.card-content p {  
  color: #c9a9d8;  
}  
  
/* Mobile */  
@media (max-width: 800px) {  
  .scene {  
    width: 300px;  
    height: 300px;  
    margin-top: 40px;  
  }  
  
  .card-3d {  
    width: 220px;  
    height: 280px;  
  }  
}  
</style>  
  
<script>  
const card = document.getElementById("card3d");  
  
document.addEventListener("mousemove", (e) => {  
  
  const x = e.clientX;  
  const y = e.clientY;  
  
  const centerX = window.innerWidth / 2;  
  const centerY = window.innerHeight / 2;  
  
  const rotateY = (x - centerX) / 25;  
  const rotateX = (centerY - y) / 25;  
  
  card.style.transform =  
    `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;  
});  
  
/* Reset when mouse leaves */  
document.addEventListener("mouseleave", () => {  
  card.style.transform = "rotateX(0deg) rotateY(0deg)";  
});  
</script>
